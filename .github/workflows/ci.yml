name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # .nvmrc is the single source of truth; fail if anything drifts from it
      - name: Node version is consistent
        run: |
          want=$(cat .nvmrc)
          dockerfile=$(grep -oE 'node:[0-9]+' Dockerfile | head -1 | cut -d: -f2)
          engines=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")
          echo ".nvmrc=$want Dockerfile=$dockerfile engines=$engines"
          if [ "$want" != "$dockerfile" ] || [ "$want" != "$engines" ]; then
            echo "::error::Node version mismatch — update .nvmrc, Dockerfile and engines together"
            exit 1
          fi

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint backend
        run: npm run lint

      - name: Unit tests (backend)
        run: npm test

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Unit tests
        run: cd frontend && npm test

      - name: Typecheck frontend
        run: cd frontend && npx tsc -b

      - name: Build frontend
        run: cd frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Start server and run smoke test
        run: |
          mkdir -p data
          node server.js &
          sleep 2
          node test/smoke.js
        env:
          JWT_SECRET: ci-test-secret
