version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors are held back: typescript-eslint 8.x reads TypeScript
      # internals that TS 7 reshaped, so ESLint dies at module load with
      # "Cannot read properties of undefined (reading 'Cjs')" before it parses
      # a single file. Nothing in our own source needs changing.
      # Remove this entry once typescript-eslint ships TS 7 support, then bump
      # typescript and typescript-eslint together in one PR.
      # Minor and patch TypeScript updates are unaffected.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node LTS line. Unattended majors already walked this image
      # 20 -> 25 -> 26 onto current-line releases while CI stayed on 20, and 25+
      # enables Web Storage by default, which breaks the jsdom test environment.
      # Move to the next LTS deliberately, updating Dockerfile, ci.yml, .nvmrc
      # and engines together.
      # Minor and patch updates still come through.
      - dependency-name: node
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
