version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Held until typescript-eslint supports TS 7 — ESLint crashes at load.
      # Then bump both together.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on LTS — Node 25+ breaks the jsdom tests. When moving, update
      # Dockerfile, ci.yml, .nvmrc and engines together.
      - dependency-name: node
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
